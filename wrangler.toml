name = "bot-crawler-b8"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Serves the Worker on the bare domain. Cloudflare creates the DNS record itself on deploy.
routes = [
  { pattern = "resonantlyferal.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "bot-crawler-b8"
# D1 database bot-crawler-b8
database_id = "00b46158-5600-4057-a64c-b45367eb4e2c"

[observability]
enabled = true
